<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abrir embalagem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Albert+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  a { color: #186B41; text-decoration: none; }
  a:hover { color: #124F30; }
</style>
</helmet>
<div style="display:flex; align-items:center; justify-content:center; width:480px; height:640px; overflow:hidden; background:rgba(21,35,28,.46); font-family:'Albert Sans',sans-serif; color:#15231C;">
  <div style="width:400px; background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 30px 70px -30px rgba(0,0,0,.5);">
    <div style="padding:20px 22px 16px; border-bottom:1px solid #F0F4ED;">
      <span style="display:block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#6B46C1;">Shake Herbalife Baunilha</span>
      <h3 style="margin:3px 0 0; font-size:18px; font-weight:700;">Abrir embalagem</h3>
    </div>

    <div style="padding:20px 22px; display:flex; flex-direction:column; gap:18px;">
      <div style="display:flex; align-items:center; gap:12px; padding:12px 14px; background:#FAFBF9; border:1px dashed #C9D3CB; border-radius:12px;">
        <span style="display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; background:#EEF2EC; color:#5C6B62; flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8h10l-1 12H8L7 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></span>
        <span style="flex:1;">
          <span style="display:block; font-size:13px; font-weight:600;">Pote anterior encerrado</span>
          <span style="display:block; font-size:12px; color:#5C6B62; margin-top:1px;">Rendeu 14 usos · <span style="color:#8A5A0F; font-weight:600;">78% do previsto</span></span>
        </span>
      </div>

      <div>
        <span style="display:block; font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#5C6B62; margin-bottom:8px;">De onde sai o novo pote</span>
        <div role="group" aria-label="Origem" style="display:flex; flex-direction:column; gap:8px;">
          <button onClick="{{ pickLoja }}" aria-pressed="{{ isLoja }}" style="{{ sLoja }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#186B41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 10v10h16V10"></path><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"></path><path d="M10 20v-5h4v5"></path></svg>
            <span style="flex:1; text-align:left;"><span style="display:block; font-size:14px; font-weight:700; color:#186B41;">Loja</span><span style="display:block; font-size:12px; color:#3D5A47;">3 potes lacrados</span></span>
            <span style="{{ rLoja }}"></span>
          </button>
          <button onClick="{{ pickDep }}" aria-pressed="{{ isDep }}" style="{{ sDep }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B5F86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;"><path d="M3 21V9l9-5 9 5v12"></path><path d="M7 21v-8h10v8"></path><path d="M7 17h10"></path></svg>
            <span style="flex:1; text-align:left;"><span style="display:block; font-size:14px; font-weight:700; color:#2B5F86;">Depósito</span><span style="display:block; font-size:12px; color:#3F5F78;">6 potes lacrados · transfere e abre</span></span>
            <span style="{{ rDep }}"></span>
          </button>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:10px; padding:16px 22px; border-top:1px solid #F0F4ED;">
      <a href="estoque-2a.dc.html" style="display:flex; align-items:center; justify-content:center; height:44px; padding:0 18px; border:1px solid #E7EEE6; border-radius:11px; font-size:13.5px; font-weight:600; color:#3D4A42;">Cancelar</a>
      <a href="estoque-2a.dc.html" style="flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:44px; border-radius:11px; background:#6B46C1; color:#fff; font-size:13.5px; font-weight:600;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18v6H3z"></path><path d="M12 3v6"></path></svg>Abrir pote</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 480, "height": 640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { from: 'loja' };
  }
  opt(on, ring, bg) {
    return 'display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border-radius:12px; ' + (on ? 'background:' + bg + '; border:1.5px solid ' + ring + ';' : 'background:#fff; border:1px solid #E7EEE6;');
  }
  radio(on, c) {
    return 'width:18px; height:18px; flex-shrink:0; border-radius:50%; ' + (on ? 'border:5px solid ' + c + ';' : 'border:1.5px solid #B9C3BB;');
  }
  renderVals() {
    const loja = this.state.from === 'loja';
    return {
      isLoja: loja, isDep: !loja,
      sLoja: this.opt(loja, '#186B41', '#F1F6EE'), sDep: this.opt(!loja, '#2B5F86', '#EAF1F7'),
      rLoja: this.radio(loja, '#186B41'), rDep: this.radio(!loja, '#2B5F86'),
      pickLoja: () => this.setState({ from: 'loja' }), pickDep: () => this.setState({ from: 'dep' }),
    };
  }
}
</script>
</body>
</html>
